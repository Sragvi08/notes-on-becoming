<main><h1>Notes on Becoming</h1><i>Kindling Curiosity</i><p>Open your private notebook with a passkey.</p><button id="enter">Sign in with a passkey</button>
<details><summary>Create your own journal</summary><form id="join"><p>Your notes, habits, and reflections belong to your account.</p><label>Name for your passkey<input required maxlength="60" id="name" autocomplete="nickname" placeholder="Your name"></label><button>Create journal</button><small>Save your passkey in a synced password manager to open your journal on other devices. Losing your only passkey can lock you out.</small></form></details><p id="status" role="status"></p></main>

async function post(action,body){const response=await fetch('/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await response.json();if(!response.ok)throw Error(json.error||'Please try again.');return json}
async function auth(kind){const message=document.querySelector('#status'),buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{
if(!window.PublicKeyCredential)throw Error('Open this page in a browser with passkey support.');
message.textContent='Waiting for your device…';
const optionsJSON=await post('options',{kind,name:document.querySelector('#name').value});
const response=kind==='register'?await SimpleWebAuthnBrowser.startRegistration({optionsJSON}):await SimpleWebAuthnBrowser.startAuthentication({optionsJSON});
await post('verify',{response});location.assign('/');
}catch(e){message.textContent=e.name==='NotAllowedError'?'The passkey prompt was closed or no matching passkey was available. You can try again.':e.message}finally{buttons.forEach(b=>b.disabled=false)}}
document.querySelector('#enter').onclick=()=>auth('signin');document.querySelector('#join').onsubmit=e=>{e.preventDefault();auth('register')};
